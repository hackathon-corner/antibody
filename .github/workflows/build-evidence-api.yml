# C3 (owner: C): build the evidence API + dashboard image, smoke-test it, push to GHCR by digest.
# The smoke test runs without ClickHouse settings, so /api/health must report 503 rather than a fake "ok".
name: build-evidence-api

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-evidence-api.yml
      - .dockerignore
      - infra/containers/evidence-api/**
      - pyproject.toml
      - src/server/**
      - src/contracts/**
      - src/adapters/**
      - src/web/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-evidence-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/hackathon-corner/antibody-evidence-api
    steps:
      - uses: actions/checkout@v4

      # Plain `docker build` (runner's built-in builder): setup-buildx pulls moby/buildkit from Docker Hub,
      # which has been timing out / rate-limiting CI.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        id: build
        run: |
          TAG="$IMAGE:sha-${{ github.sha }}"
          docker build --pull -f infra/containers/evidence-api/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/hackathon-corner/antibody \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$TAG" .
          docker push "$TAG"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$TAG" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Smoke test by digest
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE@${{ steps.build.outputs.digest }}"
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8000/ && break; sleep 1; done
          curl -sf http://localhost:8000/ | grep -qi '<div id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/health)" = 503
          docker logs api

      - name: Record digest
        run: |
          echo "image: $IMAGE@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
